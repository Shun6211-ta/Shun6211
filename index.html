<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube WatchParty</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0f0f0f; color: #f1f1f1;
      font-family: 'Roboto', 'Hiragino Sans', sans-serif;
    }
    #lobby {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #222, #0a0a0a);
    }
    .lobby-box {
      background: #181818; padding: 34px; border-radius: 16px; width: 400px;
      text-align: center; box-shadow: 0 12px 35px rgba(0,0,0,0.8);
      border: 1px solid #2c2c2c;
    }
    .lobby-box input, .lobby-box button {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; font-size: 15px;
    }
    .lobby-box input { background: #0f0f0f; color: #fff; border: 1px solid #333; text-align: center; }
    .lobby-box button { background: #ff0000; color: #fff; font-weight: bold; cursor: pointer; margin-top: 14px; }
    .lobby-box button:hover { background: #cc0000; }

    #app { display: none; }
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: rgba(15, 15, 15, 0.96); border-bottom: 1px solid #272727;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; }
    .logo-icon { background: #ff0000; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 13px; }
    .search-box { display: flex; width: 40%; max-width: 460px; }
    .search-box input {
      width: 100%; padding: 8px 14px; border-radius: 20px 0 0 20px;
      border: 1px solid #303030; background: #121212; color: #fff; outline: none;
    }
    .search-box button {
      padding: 8px 18px; border-radius: 0 20px 20px 0; border: 1px solid #303030;
      border-left: none; background: #222; color: #fff; cursor: pointer;
    }
    .room-status { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .badge { padding: 4px 10px; border-radius: 12px; font-weight: bold; }
    .host-badge { background: #f1c40f; color: #111; }
    .guest-badge { background: #272727; color: #aaa; }
    .leave-btn {
      background: #272727; color: #ff5e57; border: none; padding: 6px 14px;
      border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .leave-btn:hover { background: #382020; }
    .main-layout {
      display: flex; margin-top: 56px; height: calc(100vh - 56px);
    }
    .left-area { flex: 1; padding: 20px; overflow-y: auto; }
    .player-wrapper {
      width: 100%; aspect-ratio: 16 / 9; background: #000;
      border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6); position: relative;
    }
    .waiting-msg {
      color: #ffdd59; font-size: 20px; font-weight: bold; text-align: center; padding: 20px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    #video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px; margin-top: 14px;
    }
    .video-card { cursor: pointer; background: #181818; border-radius: 10px; overflow: hidden; transition: transform 0.15s; }
    .video-card:hover { transform: translateY(-3px); border: 1px solid #ffdd59; }
    .video-card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
    .v-title {
      padding: 8px 10px 4px 10px; font-size: 13px; font-weight: bold; margin: 0;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .v-meta { padding: 0 10px 8px 10px; font-size: 11px; color: #aaa; margin: 0; }

    .right-sidebar {
      width: 340px; border-left: 1px solid #272727; background: #141414;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .members-box {
      padding: 12px 14px; border-bottom: 1px solid #272727; background: #191919;
      max-height: 160px; overflow-y: auto;
    }
    .member-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0; font-size: 13px;
    }
    .kick-btn {
      background: #eb3b5a; color: #fff; border: none; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;
    }
    .kick-btn:hover { background: #c0392b; }

    .chat-header { padding: 10px 14px; border-bottom: 1px solid #272727; font-weight: bold; font-size: 13px; color: #aaa; }
    #chat-list { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .chat-msg { background: #1f1f1f; padding: 8px 12px; border-radius: 8px; line-height: 1.4; word-break: break-all; }
    .chat-name { font-weight: bold; color: #3ea6ff; }
    .host-name { color: #f1c40f; }
    .chat-input-box { display: flex; padding: 10px; border-top: 1px solid #272727; gap: 6px; }
    .chat-input-box input {
      flex: 1; padding: 9px 12px; border-radius: 16px; border: 1px solid #333;
      background: #0f0f0f; color: #fff; outline: none;
    }
    .chat-input-box button {
      background: #3ea6ff; color: #0f0f0f; border: none; padding: 8px 16px;
      border-radius: 16px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="lobby">
    <div class="lobby-box">
      <div style="font-size: 26px; font-weight: bold; margin-bottom: 6px;">▶ YouTube WatchParty</div>
      <p style="font-size: 13px; color: #aaa; margin-bottom: 18px;">部屋を作った人が管理者になります</p>
      <input type="text" id="name-input" placeholder="あなたのニックネームを入力">
      <input type="text" id="room-input" placeholder="部屋番号 (例: 1234)" value="1234">
      <button id="join-btn" onclick="enterRoom()">部屋に入る</button>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="logo">
        <span class="logo-icon">▶</span> WatchParty <span id="room-label" style="color:#aaa;font-size:13px;"></span>
      </div>
      <div class="search-box" id="host-search-box">
        <input type="text" id="search-input" placeholder="管理者がYouTubeを検索..." onkeydown="if(event.key==='Enter') doSearch()">
        <button onclick="doSearch()">🔍</button>
      </div>
      <div class="room-status">
        <span id="role-badge" class="badge">接続中...</span>
        <button class="leave-btn" onclick="leaveRoom(false)">退出</button>
      </div>
    </header>

    <div class="main-layout">
      <div class="left-area">
        <div class="player-wrapper" id="player-box">
          <div class="waiting-msg" id="status-screen">🔍 管理者が検索中（動画を選ぶまでお待ちください）...</div>
        </div>
        <h2 id="now-title" style="margin: 12px 0 4px 0; font-size: 18px;">待機中</h2>
        <p id="now-channel" style="margin: 0; font-size: 13px; color: #aaa;"></p>

        <div id="host-controls">
          <h3 style="margin: 22px 0 6px 0; font-size: 15px; color: #ffdd59;">👑 管理者メニュー：クリックで部屋に動画を挿入</h3>
          <div id="video-grid"></div>
        </div>
      </div>

      <div class="right-sidebar">
        <div class="members-box">
          <div style="font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: bold;">👥 参加メンバー (<span id="member-count">1</span>人)</div>
          <div id="member-list"></div>
        </div>
        <div class="chat-header">💬 チャット</div>
        <div id="chat-list"></div>
        <div class="chat-input-box">
          <input type="text" id="chat-input" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendChat()">
          <button onclick="sendChat()">送信</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const GAS_URL = 'https://google.com';
    const myId = 'U_' + Math.random().toString(36).substr(2, 6);
    let roomId = '', myName = '', isJoined = false, isHost = false;
    let currentPlayingId = null, renderedChats = new Set();

    function callGasJsonp(params) {
      return new Promise(function(resolve, reject) {
        const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        const script = document.createElement('script');
        const query = Object.keys(params).map(function(k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }).join('&');

        window[cbName] = function(data) {
          delete window[cbName];
          script.remove();
          resolve(data);
        };

        script.onerror = function() {
          delete window[cbName];
          script.remove();
          reject(new Error('JSONP Error'));
        };

        script.src = GAS_URL + '?callback=' + cbName + '&' + query;
        document.body.appendChild(script);
      });
    }

    function enterRoom() {
      const nameVal = document.getElementById('name-input').value.trim();
      if (!nameVal) {
        alert('入室する前にニックネームを入力してください！');
        return;
      }
      myName = nameVal;
      roomId = document.getElementById('room-input').value.trim() || '1234';
      document.getElementById('room-label').innerText = '[部屋: ' + roomId + ']';
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      isJoined = true;
      currentPlayingId = null;
      renderedChats.clear();
      document.getElementById('chat-list').innerHTML = '';

      const box = document.getElementById('player-box');
      box.innerHTML = '';
      const waitDiv = document.createElement('div');
      waitDiv.className = 'waiting-msg';
      waitDiv.innerText = '🔍 管理者が検索中（動画を選ぶまでお待ちください）...';
      box.appendChild(waitDiv);

      doSearch('人気 急上昇 日本');
      syncLoop();
    }

    function leaveRoom(wasKicked) {
      isJoined = false;
      document.getElementById('player-box').innerHTML = '';
      document.getElementById('app').style.display = 'none';
      document.getElementById('lobby').style.display = 'flex';
      if (wasKicked) {
        alert('管理者によって部屋から追放されました。');
      } else {
        callGasJsonp({ cmd: 'sync', roomId: roomId, userId: myId, userName: myName, action: JSON.stringify({ type: 'leave' }) });
      }
    }

    function doSearch(defaultWord) {
      const q = defaultWord || document.getElementById('search-input').value.trim();
      const grid = document.getElementById('video-grid');
      grid.innerText = 'YouTubeを検索中...';
      callGasJsonp({ cmd: 'search', query: q }).then(function(videos) {
        grid.innerHTML = '';
        videos.forEach(function(v) {
          const card = document.createElement('div');
          card.className = 'video-card';
          card.onclick = function() { selectVideoForRoom(v); };

          const img = document.createElement('img');
          img.src = v.thumb;
          const pTitle = document.createElement('p');
          pTitle.className = 'v-title';
          pTitle.innerText = v.title;
          const pMeta = document.createElement('p');
          pMeta.className = 'v-meta';
          pMeta.innerText = v.channel;

          card.appendChild(img);
          card.appendChild(pTitle);
          card.appendChild(pMeta);
          grid.appendChild(card);
        });
      });
    }
    function selectVideoForRoom(v) {
      if (!isHost) return;
      const ok = confirm('「' + v.title + '」\n\nその動画を挿入します。よろしいですか？');
      if (ok) {
        applyVideo(v);
        callGasJsonp({ cmd: 'sync', roomId: roomId, userId: myId, userName: myName, action: JSON.stringify({ type: 'setVideo', video: v }) });
      }
    }

    function applyVideo(v) {
      if (!v || currentPlayingId === v.videoId) return;
      currentPlayingId = v.videoId;
      document.getElementById('now-title').innerText = v.title;
      document.getElementById('now-channel').innerText = v.channel;

      const s = String.fromCharCode(47);
      const embedUrl = 'https:' + s + s + '://youtube.com' + s + 'embed' + s + v.videoId + '?autoplay=1&rel=0';

      const box = document.getElementById('player-box');
      box.innerHTML = '';

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.style.cssText = 'width:100%;height:100%;border:none;';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      iframe.setAttribute('allowfullscreen', 'true');

      box.appendChild(iframe);
    }

    function kickUser(targetId, targetName) {
      if (!isHost) return;
      if (confirm(targetName + ' さんを部屋から追放しますか？')) {
        callGasJsonp({ cmd: 'sync', roomId: roomId, userId: myId, userName: myName, action: JSON.stringify({ type: 'kick', targetId: targetId }) });
      }
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const nowTime = new Date().toTimeString().slice(0, 5);
      appendChatDOM(myName, isHost, text, nowTime);

      callGasJsonp({ cmd: 'sync', roomId: roomId, userId: myId, userName: myName, action: JSON.stringify({ type: 'chat', text: text }) });
    }

    function appendChatDOM(user, hostFlag, text, time) {
      const cList = document.getElementById('chat-list');
      const div = document.createElement('div');
      div.className = 'chat-msg';

      const nameSpan = document.createElement('span');
      nameSpan.className = hostFlag ? 'chat-name host-name' : 'chat-name';
      nameSpan.innerText = (hostFlag ? '👑' : '') + user + '：';

      const textNode = document.createTextNode(text + ' ');

      const timeSpan = document.createElement('span');
      timeSpan.style.cssText = 'font-size:10px;color:#666;';
      timeSpan.innerText = '(' + time + ')';

      div.appendChild(nameSpan);
      div.appendChild(textNode);
      div.appendChild(timeSpan);
      cList.appendChild(div);
      cList.scrollTop = cList.scrollHeight;
    }

    function syncLoop() {
      if (!isJoined) return;

      callGasJsonp({ cmd: 'sync', roomId: roomId, userId: myId, userName: myName })
        .then(function(res) {
          if (!isJoined) return;

          if (res.status === 'kicked') {
            leaveRoom(true);
            return;
          }

          const room = res.room;
          isHost = (room.hostId === myId);

          const badge = document.getElementById('role-badge');
          badge.innerText = isHost ? '👑 あなたが管理者' : '👀 視聴者 (管理者: ' + room.hostName + ')';
          badge.className = 'badge ' + (isHost ? 'host-badge' : 'guest-badge');

          document.getElementById('host-search-box').style.visibility = isHost ? 'visible' : 'hidden';
          document.getElementById('host-controls').style.display = isHost ? 'block' : 'none';

          if (room.currentVideo) {
            applyVideo(room.currentVideo);
          }

          const mList = document.getElementById('member-list');
          const members = Object.values(room.members);
          document.getElementById('member-count').innerText = members.length;
          mList.innerHTML = '';

          members.forEach(function(m) {
            const row = document.createElement('div');
            row.className = 'member-row';

            const nameSpan = document.createElement('span');
            nameSpan.innerText = (m.id === room.hostId ? '👑 ' : '') + m.name;
            row.appendChild(nameSpan);

            if (isHost && m.id !== myId) {
              const kickBtn = document.createElement('button');
              kickBtn.className = 'kick-btn';
              kickBtn.innerText = '追放';
              kickBtn.onclick = function() { kickUser(m.id, m.name); };
              row.appendChild(kickBtn);
            }
            mList.appendChild(row);
          });

          room.chats.forEach(function(c) {
            if (!renderedChats.has(c.id)) {
              renderedChats.add(c.id);
              if (c.senderId === myId) return;
              appendChatDOM(c.user, c.isHost, c.text, c.time);
            }
          });

          setTimeout(syncLoop, 600);
        })
        .catch(function() {
          if (isJoined) setTimeout(syncLoop, 1200);
        });
    }
  </script>
</body>
</html>
